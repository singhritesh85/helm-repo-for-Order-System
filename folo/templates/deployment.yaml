apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "folo.fullname" . }}
  labels:
    {{- include "folo.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "folo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        azure.workload.identity/use: "true"
        {{- include "folo.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "folo.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
          - name: KAFKA_SERVICE_URL
            value: {{ .Values.env.kafka_service_url }}
          - name: SPRING_DATASOURCE_URL
            value: {{ .Values.env.spring_datasource_url }}
          - name: SPRING_DATASOURCE_USERNAME
            value: {{ .Values.env.spring_datasource_username }}
          - name: SPRING_DATASOURCE_PASSWORD
            {{- if .Values.existingSecret.name }}
            valueFrom:
              secretKeyRef:
                name: {{ .Values.existingSecret.name }}
                key: {{ .Values.existingSecret.key }}
            {{- else }}
            value: {{ .Values.springDatasourcePassword | quote }}
            {{- end }}
          - name: SPRING_JPA_HIBERNATE_DDL_AUTO
            value: {{ .Values.env.spring_jpa_hibernate_ddl_auto }}
          volumeMounts:
          - name: secrets-store
            mountPath: "/mnt/secrets"
            readOnly: true
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ .Values.keyvault.secretProviderClass }}
          nodePublishSecretRef:
            name: secrets-store-creds
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
